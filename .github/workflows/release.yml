name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # the release and its assets
jobs:
  mac:
    runs-on: macos-14
    strategy: { matrix: { arch: [arm64, amd64] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: ARCH=${{ matrix.arch }} build/mac.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MOX-Access-mac-${{ matrix.arch }}.zip
  windows:
    # Pure Go: the Windows binaries cross-compile on Linux; the tests here are the OS-independent ones.
    runs-on: ubuntu-latest
    strategy: { matrix: { arch: [amd64, arm64] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: GOOS=windows GOARCH=${{ matrix.arch }} go vet ./...
      - run: ARCH=${{ matrix.arch }} build/windows.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MOX-Access-windows-${{ matrix.arch }}.zip
